name: Check mk-1 web

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mk1-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build -- --base /mk1/
