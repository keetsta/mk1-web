      @media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script>
      // the theme as the site sets it on <html>: ?theme=light|dark, else the OS
      (function () {
        var q = new URLSearchParams(location.search).get("theme");
        var dark = q ? q === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" blocking="render" src="/src/demo/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
